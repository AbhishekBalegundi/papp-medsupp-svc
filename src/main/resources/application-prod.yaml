# Production. Every value must come from the environment — no defaults here.
spring:
  datasource:
    url: ${CARTMAN_DB_URL}
    username: ${CARTMAN_DB_USER}
    password: ${CARTMAN_DB_PASSWORD}
    driver-class-name: net.sourceforge.jtds.jdbc.Driver
    hikari:
      # jTDS 1.3.1 predates JDBC 4, so Connection.isValid() throws AbstractMethodError.
      # Hikari must probe with a query instead.
      connection-test-query: SELECT 1
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  level:
    root: WARN
    com.anthem.cartman: INFO
    CARTMAN.AUDIT: INFO
